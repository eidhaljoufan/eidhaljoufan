
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#BC8CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <g fill="none" stroke="#79C0FF" stroke-opacity="0.13">
    <path d="M0 70 H1200 M0 120 H1200 M0 170 H1200 M0 220 H1200"/>
    <path d="M100 0 V280 M200 0 V280 M300 0 V280 M900 0 V280 M1000 0 V280 M1100 0 V280"/>
  </g>

  <circle cx="150" cy="90" r="3" fill="#79C0FF">
    <animate attributeName="cy" values="90;190;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="180" r="4" fill="#BC8CFF">
    <animate attributeName="cy" values="180;80;180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 240 Q300 180 600 240 T1200 220"
        fill="none" stroke="url(#glow)" stroke-width="2">
    <animate attributeName="d"
      values="M0 240 Q300 180 600 240 T1200 220;M0 220 Q300 270 600 215 T1200 240;M0 240 Q300 180 600 240 T1200 220"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="116" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48" font-weight="700" letter-spacing="3"
        fill="#F0F6FC">JHODIE NAUFAL</text>

  <rect x="440" y="139" width="320" height="2" rx="1" fill="#58A6FF">
    <animate attributeName="width" values="120;320;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="540;440;540" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="176" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" letter-spacing="2"
        fill="#E6EDF3">INFORMATICS STUDENT</text>

  <text x="600" y="205" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" letter-spacing="2"
        fill="#B8C7DB">SOFTWARE ENGINEERING · WEB · MOBILE</text>
</svg>
