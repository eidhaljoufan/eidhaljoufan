
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#BC8CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="150" rx="14" fill="url(#bg)"/>

  <path d="M0 45 Q300 100 600 45 T1200 65"
        fill="none" stroke="url(#line)" stroke-width="2">
    <animate attributeName="d"
      values="M0 45 Q300 100 600 45 T1200 65;M0 70 Q300 20 600 70 T1200 45;M0 45 Q300 100 600 45 T1200 65"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <circle cx="160" cy="70" r="3" fill="#79C0FF">
    <animate attributeName="cx" values="160;1040;160" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1040" cy="90" r="3" fill="#BC8CFF">
    <animate attributeName="cx" values="1040;160;1040" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="91" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="600" letter-spacing="1.5"
        fill="#F0F6FC">BUILD · LEARN · IMPROVE</text>

  <text x="600" y="119" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12" letter-spacing="1"
        fill="#C9D1D9">THANKS FOR VISITING MY PROFILE</text>
</svg>
